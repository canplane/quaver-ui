<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>quaver</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #container {
      width: 640px;
      height: 1136px;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@nightly"></script>
  <script>
    const swfPath = "prototype-201805312100.swf";

    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "640px";
    player.style.height = "1136px";
    document.getElementById("container").appendChild(player);
    player.load({ url: swfPath });
  </script>
</body>
</html>
